name: macOS build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Compute version
        id: version
        run: |
          pubspec_version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          semver="${pubspec_version%%+*}"
          tag="v${semver}-macos.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Package build output
        id: package
        run: |
          zip_name="procheck-macos-${{ steps.version.outputs.tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/procheck.app "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: procheck-macos-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ProCheck v${{ steps.version.outputs.semver }} (macOS)"
          body: |
            Built by CI from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            Download the zip below, unzip it, and drag `procheck.app` to Applications.

            This build is not code-signed or notarized, so macOS Gatekeeper will
            block it on first launch. Right-click (or Control-click) the app,
            choose "Open", then confirm "Open" in the dialog that appears —
            you only need to do this once.
          prerelease: true
          files: ${{ steps.package.outputs.zip_name }}
