name: Windows build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package build output
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath procheck-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: procheck-windows
          path: procheck-windows.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "Procheck (Windows) - latest build"
          body: |
            Automatically built by CI from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            Download `procheck-windows.zip` below, unzip it, and run `procheck.exe`.
            This release is overwritten on every push, so it always tracks the latest commit.
          prerelease: true
          files: procheck-windows.zip
